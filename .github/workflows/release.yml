# Release: on a version tag (v1.2.3) build the wardend binaries for Linux (amd64, arm64), publish
# them with checksums as a GitHub Release, and push the container images tagged with the version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: wardend ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: wardend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wardend/go.mod
          cache-dependency-path: wardend/go.sum
      - run: make test
      - name: Build
        run: make linux GOARCH=${{ matrix.arch }} VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: wardend-linux-${{ matrix.arch }}
          path: wardend/bin/wardend-linux-${{ matrix.arch }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum wardend-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install / upgrade the daemon
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/wardend-linux-amd64 -o wardend
            chmod +x wardend && sudo ./wardend install
            ```
            Container images: `ghcr.io/${{ github.repository_owner }}/warden-wardend:${{ github.ref_name }}` and `ghcr.io/${{ github.repository_owner }}/warden-beacon:${{ github.ref_name }}` (also `latest`). See docs/deploy.md.

  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: wardend, context: wardend }
          - { app: beacon, context: . } # the panel depends on packages/ui (ADR-014)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/warden-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }}

  # Dokploy pulls `latest` (or the release line it is pinned to) once the images are published.
  dokploy:
    name: Redeploy Beacon on Dokploy
    needs: images
    runs-on: ubuntu-latest
    steps:
      - env:
          WEBHOOK: ${{ secrets.DOKPLOY_BEACON_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DOKPLOY_BEACON_WEBHOOK is not set; skipping the redeploy."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" -o /dev/null -w "Dokploy answered %{http_code}\n"
