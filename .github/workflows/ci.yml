# CI: daemon (Go) and panel (Next.js) checks, plus both container images build (never pushed).
# The checks are the Makefile / package.json scripts, so `make lint test` and `pnpm lint && pnpm build`
# reproduce them locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wardend:
    name: wardend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wardend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wardend/go.mod
          cache-dependency-path: wardend/go.sum
      - run: make lint
      - run: make test
      - run: make linux
      - uses: actions/upload-artifact@v4
        with:
          name: wardend-linux-amd64
          path: wardend/bin/wardend-linux-amd64
          retention-days: 14

  # pnpm workspace: beacon/, landing/ and packages/ui share one lockfile, one Biome config and one job.
  web:
    name: Web (Beacon, landing, packages/ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        run: pnpm lint
      - name: Build (Beacon's next build type-checks; the landing runs astro check + build)
        env:
          # The only build-time input; auth and the database are created at runtime (lib/auth.ts).
          NEXT_PUBLIC_WARDEND_WS_URL: ws://localhost:8080
        run: pnpm typecheck && pnpm build

  # Both images are built on every run to validate the Dockerfiles; nothing is pushed here.
  # Publishing: deploy-beacon.yml (Beacon on relevant changes to main) and release.yml (both, on tags).
  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: wardend, context: wardend }
          - { app: beacon, context: . } # the panel depends on packages/ui (ADR-014)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.app }}/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/warden-${{ matrix.app }}:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }}
